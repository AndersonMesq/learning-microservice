name: Learing Microservice Continuos Deployment with GitHub Actions

on:
  push:
    branches:
      - "main"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_ASSESS_TOKEN}}

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'adopt'

      - name: Build Eureka Naming Server Docker Image
        working-directory: ./naming-server
        run: mvn clean package

      - name: Build Api Gateway Docker Image
        working-directory: ./api-gateway
        run: mvn clean package

      - name: Build Book Service Docker Image
        working-directory: ./book-service
        run: mvn clean package

      - name: Build Exchange Service Docker Image
        working-directory: ./exchange-service
        run: mvn clean package

      - name: Tag Docker images
        run:
          docker tag ${{secrets.DOCKER_USERNAME}}/naming-server:latest ${{secrets.DOCKER_USERNAME}}/naming-server:latest
          docker tag ${{secrets.DOCKER_USERNAME}}/naming-server:latest ${{secrets.DOCKER_USERNAME}}/naming-server:${{github.RUN_ID}}
          docker tag ${{secrets.DOCKER_USERNAME}}/api-gateway:latest ${{secrets.DOCKER_USERNAME}}/api-gateway:latest
          docker tag ${{secrets.DOCKER_USERNAME}}/api-gateway:latest ${{secrets.DOCKER_USERNAME}}/api-gateway:${{github.RUN_ID}}
          docker tag ${{secrets.DOCKER_USERNAME}}/book-service:latest ${{secrets.DOCKER_USERNAME}}/book-service:${{github.RUN_ID}}
          docker tag ${{secrets.DOCKER_USERNAME}}/exchange-service:latest ${{secrets.DOCKER_USERNAME}}/exchange-gateway:${{github.RUN_ID}}

      - name: Push Docker Images to Docker Hub
        run:
          docker push ${{secrets.DOCKER_USERNAME}}/naming-server:latest
          docker push ${{secrets.DOCKER_USERNAME}}/naming-server:${{github.RUN_ID}}
          docker push ${{secrets.DOCKER_USERNAME}}/api-gateway:latest
          docker push ${{secrets.DOCKER_USERNAME}}/api-gateway:${{github.RUN_ID}}
          docker push ${{secrets.DOCKER_USERNAME}}/book-service:latest
          docker push ${{secrets.DOCKER_USERNAME}}/book-service:${{github.RUN_ID}}
          docker push ${{secrets.DOCKER_USERNAME}}/exchange-service:latest
          docker push ${{secrets.DOCKER_USERNAME}}/exchange-service:${{github.RUN_ID}}